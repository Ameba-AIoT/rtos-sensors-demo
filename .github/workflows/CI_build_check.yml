name: CI Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: all-demos or specific'
        required: true
        default: 'all-demos'
        type: choice
        options:
          - all-demos
          - specific-demo
      demo_name:
        description: 'Demo name to build (only if specific-demo selected)'
        required: false
        type: string

jobs:
  detect-demos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      changed-demos: ${{ steps.set-changed.outputs.demos }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changed demo folders
      id: set-changed
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # Manual trigger: build all demos or specific
          BUILD_MODE="${{ inputs.build_mode }}"
          if [[ "$BUILD_MODE" == "all-demos" ]]; then
            # Mark all demos as changed - get all valid demos
            CHANGED=""
            for dir in *_demo; do
              if [[ -d "$dir" && -f "$dir/soc_info.json" && -f "$dir/app.bin" && -f "$dir/boot.bin" ]]; then
                CHANGED="$CHANGED $(echo $dir | sed 's|_demo||')"
              fi
            done
            CHANGED=$(echo "$CHANGED" | xargs)
          else
            # Specific demo
            DEMO="${{ inputs.demo_name }}"
            if [[ -d "${DEMO}_demo" && -f "${DEMO}_demo/soc_info.json" && -f "${DEMO}_demo/app.bin" && -f "${DEMO}_demo/boot.bin" ]]; then
              CHANGED="$DEMO"
            else
              echo "Error: Demo '${DEMO}_demo' not found or missing required files"
              exit 1
            fi
          fi
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # PR: get changed files relative to base branch
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -o '^[^/]*_demo/' | sort -u | sed 's|/||' | tr '\n' ' ' | xargs)
        else
          # Push: get changed files in latest commit
          CHANGED=$(git diff --name-only ${{ github.event.before }}...${{ github.event.after }} | grep -o '^[^/]*_demo/' | sort -u | sed 's|/||' | tr '\n' ' ' | xargs)
        fi
        echo "demos=$CHANGED" >> $GITHUB_OUTPUT
        echo "Changed demos: $CHANGED"

    - name: Detect all valid demos
      id: set-matrix
      run: |
        DEMOS=()
        for dir in *_demo; do
          if [[ -d "$dir" && -f "$dir/soc_info.json" && -f "$dir/app.bin" && -f "$dir/boot.bin" ]]; then
            DEMOS+=("$dir")
          fi
        done

        # Convert to JSON array
        MATRIX=$(printf '%s\n' "${DEMOS[@]}" | jq -R . | jq -s . | jq -c .)
        echo "matrix={\"demo\":$MATRIX}" >> $GITHUB_OUTPUT
        echo "Found demos: $MATRIX"

  setup-toolchain:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout SDK repository
      uses: actions/checkout@v4
      with:
        repository: Ameba-AIoT/ameba-rtos
        path: ameba-rtos

    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: /opt/rtk-toolchain
        key: rtk-toolchain-linux-1.0.3-${{ runner.os }}
        restore-keys: rtk-toolchain-linux

    - name: Setup build environment
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build jq wget 7zip
        mkdir -p /opt/rtk-toolchain
        cd /opt/rtk-toolchain
        wget https://github.com/Ameba-AIoT/ameba-toolchain/releases/download/prebuilts-v1.0.3/prebuilts-linux-1.0.3.tar.gz
        tar -xzf prebuilts-linux-1.0.3.tar.gz

    - name: Setup SDK dependencies
      run: |
        cd ${{ github.workspace }}/ameba-rtos
        python -m pip install --upgrade pip
        pip install -r ${{ github.workspace }}/ameba-rtos/tools/requirements.txt
        sudo chmod +x ameba.py
        sudo chmod +x env.sh

    - name: Upload SDK and tools
      uses: actions/upload-artifact@v4
      with:
        name: ameba-rtos-sdk
        path: ameba-rtos
        retention-days: 1

  build-matrix:
    runs-on: ubuntu-latest
    needs: [detect-demos, setup-toolchain]
    if: needs.detect-demos.outputs.matrix != '{"demo":[]}'
    strategy:
      matrix: ${{ fromJson(needs.detect-demos.outputs.matrix) }}
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download SDK and tools
      uses: actions/download-artifact@v4
      with:
        name: ameba-rtos-sdk
        path: ameba-rtos

    - name: Restore toolchain cache
      uses: actions/cache@v4
      with:
        path: /opt/rtk-toolchain
        key: rtk-toolchain-linux-1.0.3-${{ runner.os }}
        restore-keys: rtk-toolchain-linux

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build jq
        sudo ln -sf /bin/bash /bin/sh
        export RTK_TOOLCHAIN_DIR=/opt/rtk-toolchain

    - name: Check if demo was changed
      id: check-changed
      run: |
        CHANGED_DEMOS="${{ needs.detect-demos.outputs.changed-demos }}"
        CURRENT_DEMO="${{ matrix.demo }}"
        DEMO_NAME=$(echo "$CURRENT_DEMO" | sed 's|_demo||')

        if echo " $CHANGED_DEMOS " | grep -qE " ${DEMO_NAME}( |$)"; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Demo $CURRENT_DEMO will be built"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "Demo $CURRENT_DEMO not in changed list, skipping"
        fi

    - name: Validate demo structure
      if: steps.check-changed.outputs.changed == 'true'
      run: |
        DEMO_PATH="${{ github.workspace }}/${{ matrix.demo }}"

        if [[ ! -d "$DEMO_PATH" ]]; then
          echo "Error: Demo directory not found: $DEMO_PATH"
          exit 1
        fi

        # Check required files
        SOC_JSON="$DEMO_PATH/soc_info.json"
        APP_BIN="$DEMO_PATH/app.bin"
        BOOT_BIN="$DEMO_PATH/boot.bin"
        CMAKELISTS="$DEMO_PATH/CMakeLists.txt"

        if [[ ! -f "$SOC_JSON" || ! -f "$APP_BIN" || ! -f "$BOOT_BIN" || ! -f "$CMAKELISTS" ]]; then
          echo "Error: Missing required files in ${{ matrix.demo }}"
          echo "  soc_info.json: $(test -f "$SOC_JSON" && echo 'OK' || echo 'MISSING')"
          echo "  app.bin: $(test -f "$APP_BIN" && echo 'OK' || echo 'MISSING')"
          echo "  boot.bin: $(test -f "$BOOT_BIN" && echo 'OK' || echo 'MISSING')"
          echo "  CMakeLists.txt: $(test -f "$CMAKELISTS" && echo 'OK' || echo 'MISSING')"
          exit 1
        fi

    - name: Build ${{ matrix.demo }}
      if: steps.check-changed.outputs.changed == 'true'
      env:
        RTK_TOOLCHAIN_DIR: /opt/rtk-toolchain
      run: |
        cd ${{ github.workspace }}/${{ matrix.demo }}
        source ${{ github.workspace }}/ameba-rtos/env.sh

        echo "Building demo: ${{ matrix.demo }}"
        python ${{ github.workspace }}/ameba-rtos/ameba.py build

    - name: Check build output
      if: steps.check-changed.outputs.changed == 'true'
      run: |
        DEMO_PATH="${{ github.workspace }}/${{ matrix.demo }}"
        OTA_ALL_BIN=$(find "$DEMO_PATH" -name "ota_all.bin" -type f | head -1)

        if [[ -z "$OTA_ALL_BIN" ]]; then
          echo "Error: Build failed for ${{ matrix.demo }}, ota_all.bin not found"
          echo "Build artifacts search:"
          find "$DEMO_PATH" -name "*.bin" -type f 2>/dev/null || echo "No .bin files found"
          exit 1
        fi

        echo "✓ Successfully built ${{ matrix.demo }}"
        ls -lh "$OTA_ALL_BIN"

    - name: Skip build (no changes)
      if: steps.check-changed.outputs.changed == 'false'
      run: |
        echo "⊘ Demo ${{ matrix.demo }} not modified, skipped"

  build-summary:
    runs-on: ubuntu-latest
    needs: [detect-demos, build-matrix]
    if: always()

    steps:
    - name: Summarize results
      run: |
        echo "════════════════════════════════════════"
        echo "CI Build Check Summary"
        echo "════════════════════════════════════════"

        DETECT_STATUS="${{ needs.detect-demos.result }}"
        BUILD_STATUS="${{ needs.build-matrix.result }}"

        echo "Detection: $DETECT_STATUS"
        echo "Build: $BUILD_STATUS"

        if [[ "$DETECT_STATUS" == "success" && "$BUILD_STATUS" == "success" ]]; then
          echo "✓ All changed demos built successfully"
          exit 0
        elif [[ "$DETECT_STATUS" == "failure" ]]; then
          echo "✗ Failed to detect demos"
          exit 1
        elif [[ "$BUILD_STATUS" == "failure" ]]; then
          echo "✗ Some demos failed to build"
          exit 1
        else
          echo "⊘ No demos detected or all skipped"
          exit 0
        fi
