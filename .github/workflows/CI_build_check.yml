name: CI Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: all-demos or specific'
        required: true
        default: 'all-demos'
        type: choice
        options:
          - all-demos
          - specific-demo
      demo_name:
        description: 'Demo name to build (only if specific-demo selected)'
        required: false
        type: string

jobs:
  # ====================================================================
  # Phase 1 — detect which demos need building
  # ====================================================================
  detect-demos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Detect changed / requested demos
      id: set-matrix
      run: |
        case "${{ github.event_name }}" in
          workflow_dispatch)
            if [[ "${{ inputs.build_mode }}" == "all-demos" ]]; then
              DEMOS=$(ls -d *_demo 2>/dev/null | sed 's|_demo/\?$||' | tr '\n' ' ' | xargs)
            else
              DEMOS="${{ inputs.demo_name }}"
            fi
            ;;
          pull_request)
            DEMOS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -o '^[^/]*_demo/' | sort -u | sed 's|_demo/||' | tr '\n' ' ' | xargs)
            ;;
          *)
            DEMOS=$(git diff --name-only "${{ github.event.before }}...${{ github.event.after }}" \
              | grep -o '^[^/]*_demo/' | sort -u | sed 's|_demo/||' | tr '\n' ' ' | xargs)
            ;;
        esac

        if [[ -z "${DEMOS// /}" ]]; then
          echo "matrix={\"demo\":[]}" >> "$GITHUB_OUTPUT"
          echo "No demos to build."
        else
          MATRIX=$(echo "$DEMOS" | tr ' ' '\n' | jq -R . | jq -s . | jq -c '{demo: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Demos to build: $DEMOS"
        fi

  # ====================================================================
  # Phase 2 — SDK environment setup (toolchain + Python venv, cached)
  # ====================================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      prebuilts_version: ${{ steps.prebuilts.outputs.prebuilts_version }}
      req_hash: ${{ steps.prebuilts.outputs.req_hash }}

    steps:
    - name: Checkout SDK repository
      uses: actions/checkout@v7
      with:
        repository: Ameba-AIoT/ameba-rtos
        ref: release/v1.2
        path: ameba-rtos
        persist-credentials: false
        submodules: 'recursive'

    - name: Platform prepare — install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build jq
        sudo ln -sf /bin/bash /bin/sh
        python -m pip install --upgrade pip

    - name: Read prebuilts version from SDK env.sh
      id: prebuilts
      shell: bash
      run: |
        VER=$(head -n1 ameba-rtos/env.sh | cut -d= -f2)
        REQ_HASH=$(sha256sum ameba-rtos/tools/requirements.txt | cut -d' ' -f1)
        echo "prebuilts_version=$VER"  >> "$GITHUB_OUTPUT"
        echo "req_hash=$REQ_HASH"      >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------
    # Cache toolchain — shared across all matrix build jobs
    # ---------------------------------------------------------------
    - name: Cache toolchain
      uses: actions/cache@v6
      with:
        path: toolchain
        key: toolchain-linux-${{ steps.prebuilts.outputs.prebuilts_version }}

    - name: Cache Python virtual environment
      uses: actions/cache@v6
      with:
        path: ameba-rtos/.venv
        key: venv-linux-${{ steps.prebuilts.outputs.req_hash }}

    - name: Setup SDK environment — toolchain + Python venv
      shell: bash
      run: |
        set -e

        # Swap download source: GitHub primary (faster on GitHub Actions)
        sed -i \
          's|^DOWNLOAD_URL=$PREBUILTS_LINUX_URL_ALIYUN|DOWNLOAD_URL=$PREBUILTS_LINUX_URL|; t; s|^DOWNLOAD_URL_SECOND_SOURCE=$PREBUILTS_LINUX_URL|DOWNLOAD_URL_SECOND_SOURCE=$PREBUILTS_LINUX_URL_ALIYUN|' \
          ameba-rtos/env.sh

        # Workspace-relative toolchain dir (cacheable, no sudo needed)
        mkdir -p toolchain
        export RTK_TOOLCHAIN_DIR="$(cd toolchain && pwd)"

        # env.sh handles download + extract + Python venv + requirements
        source ameba-rtos/env.sh

        echo "SDK path:       $AMEBA_SDK"
        echo "Toolchain dir:  $RTK_TOOLCHAIN_DIR"
        echo "Prebuilts dir:  $PREBUILTS_DIR"
        echo "Python venv:    ${VIRTUAL_ENV:-<not activated>}"

  # ====================================================================
  # Phase 3 — build each changed demo in parallel
  # ====================================================================
  build:
    runs-on: ubuntu-latest
    needs: [detect-demos, setup]
    if: needs.detect-demos.outputs.matrix != '{"demo":[]}'
    strategy:
      matrix: ${{ fromJson(needs.detect-demos.outputs.matrix) }}
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Checkout SDK repository
      uses: actions/checkout@v7
      with:
        repository: Ameba-AIoT/ameba-rtos
        ref: release/v1.2
        path: sdk
        persist-credentials: false
        submodules: 'recursive'

    # ---------------------------------------------------------------
    # Restore toolchain & Python venv from cache
    # ---------------------------------------------------------------
    - name: Restore toolchain cache
      uses: actions/cache@v6
      with:
        path: toolchain
        key: toolchain-linux-${{ needs.setup.outputs.prebuilts_version }}

    - name: Restore Python venv cache
      uses: actions/cache@v6
      with:
        path: sdk/.venv
        key: venv-linux-${{ needs.setup.outputs.req_hash }}

    - name: Build ${{ matrix.demo }}
      shell: bash
      run: |
        set -e

        # Swap download source (same as setup job — idempotent)
        sed -i \
          's|^DOWNLOAD_URL=$PREBUILTS_LINUX_URL_ALIYUN|DOWNLOAD_URL=$PREBUILTS_LINUX_URL|; t; s|^DOWNLOAD_URL_SECOND_SOURCE=$PREBUILTS_LINUX_URL|DOWNLOAD_URL_SECOND_SOURCE=$PREBUILTS_LINUX_URL_ALIYUN|' \
          sdk/env.sh

        export RTK_TOOLCHAIN_DIR="$(cd toolchain && pwd)"
        source sdk/env.sh

        cd "${{ matrix.demo }}_demo"
        python ../sdk/ameba.py build -p -D USE_SECOND_SOURCE=True

    - name: Check build output — ${{ matrix.demo }}
      run: |
        OTA_ALL_BIN=$(find "${{ matrix.demo }}_demo" -name "ota_all.bin" -type f | head -1)
        if [[ -z "$OTA_ALL_BIN" ]]; then
          echo "::error::Build failed for ${{ matrix.demo }} — ota_all.bin not found"
          exit 1
        fi
        echo "✓ ${{ matrix.demo }} built successfully"
        ls -lh "$OTA_ALL_BIN"
